name: korp-full

services:
  estoque-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: korp-full-estoque-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Korp_Dev_2026!}
    ports:
      - "1435:1433"
    volumes:
      - estoque-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  faturamento-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: korp-full-faturamento-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Korp_Dev_2026!}
    ports:
      - "1436:1433"
    volumes:
      - faturamento-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  estoque-api:
    build:
      context: .
      dockerfile: src/Estoque/Korp.Estoque.Api/Dockerfile
    container_name: korp-full-estoque-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__EstoqueDatabase: "Server=estoque-db,1433;Database=KorpEstoque;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Korp_Dev_2026!};TrustServerCertificate=True;Encrypt=False"
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "5237:8080"
    depends_on:
      estoque-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet "http://127.0.0.1:8080/api/v1/products?pageNumber=1&pageSize=1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  faturamento-api:
    build:
      context: .
      dockerfile: src/Faturamento/Korp.Faturamento.Api/Dockerfile
    container_name: korp-full-faturamento-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__FaturamentoDatabase: "Server=faturamento-db,1433;Database=KorpFaturamento;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Korp_Dev_2026!};TrustServerCertificate=True;Encrypt=False"
      Database__ApplyMigrationsOnStartup: "true"
      InventoryApi__BaseUrl: "http://estoque-api:8080"
      InventoryApi__TimeoutSeconds: "10"
    ports:
      - "5093:8080"
    depends_on:
      faturamento-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet "http://127.0.0.1:8080/api/v1/invoices" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: src/Web
      dockerfile: Dockerfile
    container_name: korp-full-frontend
    ports:
      - "4201:80"
    depends_on:
      estoque-api:
        condition: service_healthy
      faturamento-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  estoque-sqlserver-data:
  faturamento-sqlserver-data:
