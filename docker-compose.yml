services:
  estoque-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: korp-estoque-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Korp_Dev_2026!}
    ports:
      - "1433:1433"
    volumes:
      - estoque-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  estoque-sqlserver-data:
